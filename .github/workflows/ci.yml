# 主干门禁（IMPROVEMENT_PLAN T3）：release.yml 只在 tag 触发，此前主干无任何检查
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖与工具
        run: pip install -e . pytest ruff
      - name: ruff（F/E9/B/SIM/UP + T4 分层规则）
        working-directory: backend
        run: ruff check app --select F,E9,B,SIM,UP,TID251
      - name: pytest
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
