name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 创建 Release 并附加二进制需要 GITHUB_TOKEN 的写权限（默认只读）
permissions:
  contents: write

jobs:
  # ⓪ 先一次性创建 Release 并生成说明（**Full Changelog** 只在这一步出现）。
  #   之前由三个 matrix 上传步骤各自带 generate_release_notes=true——对已存在的
  #   Release 每更新一次 GitHub 就往 body 追加一段生成说明，v0.4.3 因此重复 5 遍。
  #   幂等：Release 已存在（失败重跑）直接跳过，不再动 body。
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: 创建 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

  # ① wheel 发布到 PyPI —— 用户可用 uvx nmail / pipx install nmail 一条命令运行
  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 构建前端并同步进包
        run: bash scripts/sync_frontend.sh
      - name: 构建 wheel / sdist
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: 发布到 PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: nmail-wheel
          path: dist/*.whl

  # ③ nmail-cli 独立发到 PyPI（REDESIGN_PLAN §19 Skill 化 P2；uvx nmail-cli@latest）
  #    版本号在 nmail-cli/pyproject.toml，发版前按需 bump。默认复用主 PYPI_API_TOKEN；
  #    若该 token 是项目级（只限 nmail 包），在 repo secrets 配 PYPI_CLI_API_TOKEN。
  nmail-cli-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 构建 nmail-cli wheel/sdist
        run: |
          python -m pip install --upgrade build
          cd nmail-cli
          python -m build
      - name: 发布到 PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_CLI_API_TOKEN || secrets.PYPI_API_TOKEN }}
          packages-dir: nmail-cli/dist

  # ② 三平台单文件可执行 —— 双击即用，挂到 GitHub Release
  binaries:
    needs: create-release  # Release 已先建好，上传步骤一律不再生成说明（防 body 重复追加）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: nmail-windows-x64, ext: .exe }
          - { os: macos-latest, name: nmail-macos-arm64, ext: "" }
          - { os: ubuntu-latest, name: nmail-linux-x64, ext: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 构建前端并同步进包
        run: bash scripts/sync_frontend.sh
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller
      - name: PyInstaller 打包
        run: pyinstaller nmail.spec
      - name: 重命名产物
        shell: bash
        run: mv dist/nmail${{ matrix.ext }} "${{ matrix.name }}${{ matrix.ext }}"
      # macOS 追加标准应用包资产（UPDATE_AND_DESKTOP.md §4，用户已同意）：
      # 解压拖进「应用程序」即用；结构与 core/desktop.py 运行时生成的一致
      # （存根为应用面注册 Dock，冻结二进制为其子进程），保证二者可互换。
      - name: 打包 macOS Nmail.app.zip
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          mkdir -p Nmail.app/Contents/MacOS Nmail.app/Contents/Resources
          cp backend/app/assets/nmail-stub Nmail.app/Contents/MacOS/nmail
          cp "${{ matrix.name }}${{ matrix.ext }}" Nmail.app/Contents/MacOS/nmail-bin
          chmod +x Nmail.app/Contents/MacOS/nmail Nmail.app/Contents/MacOS/nmail-bin
          cat > Nmail.app/Contents/MacOS/server <<'SCRIPT'
          #!/bin/bash
          "$(dirname "$0")/nmail-bin" "$@" &
          CHILD=$!
          trap 'kill "$CHILD" 2>/dev/null' TERM INT
          wait "$CHILD"
          SCRIPT
          cat > Nmail.app/Contents/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key><string>Nmail</string>
              <key>CFBundleDisplayName</key><string>Nmail</string>
              <key>CFBundleIdentifier</key><string>com.whizzzest.nmail</string>
              <key>CFBundleVersion</key><string>${VERSION}</string>
              <key>CFBundleShortVersionString</key><string>${VERSION}</string>
              <key>CFBundleExecutable</key><string>nmail</string>
              <key>CFBundleIconFile</key><string>AppIcon</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
              <key>LSMinimumSystemVersion</key><string>11.0</string>
              <key>NSHighResolutionCapable</key><true/>
              <key>LSApplicationCategoryType</key><string>public.app-category.productivity</string>
          </dict>
          </plist>
          PLIST
          echo "APPL????" > Nmail.app/Contents/PkgInfo
          cp backend/app/assets/nmail.icns Nmail.app/Contents/Resources/AppIcon.icns
          zip -qry "${{ matrix.name }}.app.zip" Nmail.app
      # DMG 两栏拖装（WIND_DOWN_PLAN 决策 2：dmg 首选，.app.zip 保留）
      - name: 打包 macOS DMG
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          DMG_DIR=$(mktemp -d)
          cp -R Nmail.app "$DMG_DIR/"
          ln -s /Applications "$DMG_DIR/Applications"
          hdiutil create -volname Nmail -srcfolder "$DMG_DIR" -format UDZO -ov "${{ matrix.name }}.dmg"
      # Windows 解压即用（WIND_DOWN_PLAN 决策 6：无签名，SmartScreen 警告依旧，仅打包体验升级）
      - name: 打包 Windows portable zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path ${{ matrix.name }}${{ matrix.ext }} -DestinationPath ${{ matrix.name }}.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}${{ matrix.ext }}
      - name: 上传 .app.zip 构建产物
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}.app.zip
          path: ${{ matrix.name }}.app.zip
      - name: 上传 DMG 构建产物
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}.dmg
          path: ${{ matrix.name }}.dmg
      - name: 上传 Windows zip 构建产物
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}.zip
          path: ${{ matrix.name }}.zip
      - name: 附加到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}${{ matrix.ext }}
      - name: .app.zip 附加到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.app.zip
      - name: DMG 附加到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.dmg
      - name: Windows zip 附加到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.zip

  # ③ 同步 Homebrew tap（可选：在仓库 Secrets 配置 HOMEBREW_TAP_TOKEN——
  #    一个可写 nathanpenny520/homebrew-nmail 的 fine-grained PAT；未配置时此 job 直接跳过）
  homebrew-tap:
    needs: [python-package, binaries]  # 要下载 macOS 资产算 SHA256，必须等 binaries 全部挂完
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      # cask 步骤要渲染仓库内 scripts/cask_template.rb——本 job 原设计纯 API 无
      # checkout，v0.4.3 发版实测文件不存在必挂（sed: No such file），故补 checkout
      - uses: actions/checkout@v4
      - name: 更新 tap formula 版本与哈希
        if: env.TAP_TOKEN != ''
        run: |
          set -e
          TAG_REF="${GITHUB_REF_NAME}"   # v0.1.1
          TAG="${TAG_REF#v}"             # 0.1.1
          URL="https://github.com/nathanpenny520/Nmail/releases/download/${TAG_REF}/nmail-macos-arm64"
          SHA=$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1)
          AUTH="Authorization: Bearer $TAP_TOKEN"
          OLD=$(curl -fsSL -H "$AUTH" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/nathanpenny520/homebrew-nmail/contents/Formula/nmail.rb?ref=main")
          BLOB_SHA=$(curl -fsSL -H "$AUTH" \
            "https://api.github.com/repos/nathanpenny520/homebrew-nmail/contents/Formula/nmail.rb?ref=main" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['sha'])")
          NEW=$(printf '%s' "$OLD" \
            | sed -e "s#releases/download/v[0-9][0-9.]*#releases/download/${TAG_REF}#" \
                  -e "s#sha256 \"[0-9a-f]*\"#sha256 \"${SHA}\"#" \
                  -e "s#version \"[0-9][0-9.]*\"#version \"${TAG}\"#")
          B64=$(printf '%s' "$NEW" | base64 -w0)
          curl -fsSL -X PUT -H "$AUTH" \
            "https://api.github.com/repos/nathanpenny520/homebrew-nmail/contents/Formula/nmail.rb" \
            -d "{\"message\":\"nmail ${TAG}\",\"content\":\"${B64}\",\"sha\":\"${BLOB_SHA}\"}" > /dev/null
          echo "tap updated to ${TAG}"
      # GUI 渠道：渲染 Casks/nmail.rb 并 create-or-update（WIND_DOWN_PLAN 决策 1，自家 tap cask）
      - name: 更新 tap cask（dmg 拖装，无 Gatekeeper 警告）
        if: env.TAP_TOKEN != ''
        run: |
          set -e
          TAG_REF="${GITHUB_REF_NAME}"
          TAG="${TAG_REF#v}"
          URL="https://github.com/nathanpenny520/Nmail/releases/download/${TAG_REF}/nmail-macos-arm64.dmg"
          SHA=$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1)
          sed -e "s#{{VERSION}}#${TAG}#" -e "s#{{SHA256}}#${SHA}#" scripts/cask_template.rb > /tmp/nmail.rb
          AUTH="Authorization: Bearer $TAP_TOKEN"
          HTTP=$(curl -sSL -o /tmp/cask_meta.json -w '%{http_code}' -H "$AUTH" \
            "https://api.github.com/repos/nathanpenny520/homebrew-nmail/contents/Casks/nmail.rb?ref=main" || true)
          BLOB_SHA=""
          if [ "$HTTP" = "200" ]; then
            BLOB_SHA=$(python3 -c "import json; print(json.load(open('/tmp/cask_meta.json')).get('sha',''))")
          fi
          if [ -n "$BLOB_SHA" ]; then SHA_JSON="\"sha\":\"${BLOB_SHA}\","; else SHA_JSON=""; fi
          B64=$(base64 -w0 /tmp/nmail.rb)
          curl -fsSL -X PUT -H "$AUTH" \
            "https://api.github.com/repos/nathanpenny520/homebrew-nmail/contents/Casks/nmail.rb" \
            -d "{\"message\":\"nmail cask ${TAG}\",${SHA_JSON}\"content\":\"${B64}\"}" > /dev/null
          echo "cask updated to ${TAG}"
