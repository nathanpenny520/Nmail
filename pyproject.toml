[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# 发行名不能叫 "nmail"：PyPI 上已被第三方占用（One-line SMTP email sender）。
# 命令名保持 nmail；安装用 `pip install nmail-app`，uvx 用 `uvx --from nmail-app nmail`。
name = "nmail-app"
version = "0.4.4"  # 版本唯一来源：config.py 运行时解析本文件（冻结包由 nmail.spec 打入随包资源），无需改他处
description = "AI 驱动的本地聚合邮箱客户端 · 本地优先 · 隐私自持"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["email", "imap", "smtp", "ai", "local-first"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "platformdirs>=4.0",
    "openai>=1.50",
    "httpx>=0.27",
    "imap-tools>=1.5",
    "PySocks>=1.7.1",
    "beautifulsoup4>=4.12",
    "markdown>=3.6",
    "nh3>=0.2",
    "apscheduler>=3.10",
    "python-multipart>=0.0.9",
]

[project.scripts]
nmail = "app.cli:main"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]

# 前端构建产物由 scripts/sync_frontend.sh 同步进 app/static 后一起打入 wheel；
# assets/ 是桌面图标生成资产（UPDATE_AND_DESKTOP.md §2），nmail.spec datas 同步打入冻结包
[tool.setuptools.package-data]
app = ["static/**/*", "assets/**/*"]

# ── pytest（T1：纯函数层优先，零覆盖率指标）──────────────────────
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

# ── 分层规则（IMPROVEMENT_PLAN T4）────────────────────────────────
# 禁止 core/scheduler/ai/db 反向依赖 API 层；检查命令见 CLAUDE.md：
#   ruff check app --select F,TID251
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"app.api".msg = "分层规则（T4）：core/scheduler/ai/db 不得 import app.api.*——跨层复用请下沉到 core/"

[tool.ruff.lint.per-file-ignores]
# API 层内部互引与入口装配是合法的
"**/app/api/**" = ["TID251"]
"**/app/main.py" = ["TID251"]
# 未来 pytest（T1）经 TestClient 引用路由层属测试入口
"**/tests/**" = ["TID251"]
